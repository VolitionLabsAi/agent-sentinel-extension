name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run check-types

      - name: Build
        run: npm run build -- --production

      - name: Create test workspace
        run: mkdir -p .vscode-test-workspace/.volition/sentinel

      - name: Run tests (performance + E2E)
        run: xvfb-run -a npm test
        env:
          DISPLAY: ':99'

      - name: Run performance benchmarks
        run: node benchmarks/run-benchmarks.js

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmarks/benchmark-results.json
          if-no-files-found: ignore

      - name: Package extension
        run: npx @vscode/vsce package --allow-missing-repository

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: agent-sentinel-vsix
          path: '*.vsix'
