name: Bug Report
description: Report a bug in Agent Sentinel
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this?
      placeholder: |
        1. Open VS Code with sentinel configured
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened?
    validations:
      required: true
  - type: input
    id: vscode-version
    attributes:
      label: VS Code Version
      placeholder: "1.100.0"
    validations:
      required: true
  - type: dropdown
    id: harness
    attributes:
      label: AI Harness
      options:
        - Claude Code
        - GitHub Copilot
        - Codex CLI
        - Gemini CLI
        - Other
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: "macOS 15.4 / Ubuntu 24.04 / Windows 11"
    validations:
      required: true
